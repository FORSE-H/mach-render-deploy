[project]
name = "mach-backend"
version = "0.1.0"
description = "MACH — Machine-Actionable Catalog for Healthcare: backend API and harvester"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "duckdb>=1.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "fastmcp>=3.3.1",
    "httpx>=0.27",
    "fastembed>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "schemathesis>=3.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "adapters", "edges"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not slow'"
markers = [
    "slow: opt-in tests that download models or hit the network (run with -m slow)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/suggest_judgement.py" = ["E501", "F841"]
"scripts/check_urls.py" = ["E501", "F541"]
"scripts/fetch_swhids.py" = ["E501"]
