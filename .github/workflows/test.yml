name: Tests

# Run the unit test suite on every PR and push to main. Tests are pure (no
# network — they use a fake HTTP client), so the run is fast and deterministic.
# The 'not slow' marker (set in pyproject) excludes any opt-in network tests.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (with dev)
        run: uv sync --frozen

      - name: Run tests
        run: uv run python -m pytest tests/ -q
